name: Checks
on:
  workflow_call:
    inputs:
      runs_on:
        description: Linux runner label (ubuntu-latest or carini).
        type: string
        default: ubuntu-latest
      mode:
        description: fs or image.
        type: string
        default: fs
      target:
        description: Source directory or registry image.
        type: string
        default: .
      fail-on:
        description: Gate severities, or NONE.
        type: string
        default: HIGH,CRITICAL
    secrets:
      registry-username:
        required: false
      registry-password:
        required: false
permissions:
  contents: read
  id-token: write
jobs:
  scan:
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: 40
    steps:
      - name: Check out project
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Scan and connect to Checks
        uses: automatearmy/checks-action@48d8dee008bdfeb8b4220b54912c837e392c2dbb
        env:
          CHECKS_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          TRIVY_USERNAME: ${{ secrets.registry-username }}
          TRIVY_PASSWORD: ${{ secrets.registry-password }}
        with:
          mode: ${{ inputs.mode }}
          target: ${{ inputs.target }}
          fail-on: ${{ inputs.fail-on }}
          upload: ${{ github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && contains(fromJSON('["push","workflow_dispatch","schedule"]'), github.event_name) }}
