name: Validate connector
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: carini
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s tests -v
